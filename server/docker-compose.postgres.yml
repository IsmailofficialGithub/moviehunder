# Temporary local Postgres for MovieHunter auth/sync.
# Usage:
#   docker compose -f docker-compose.postgres.yml up -d
#   npx prisma migrate deploy
# Stop/remove:
#   docker compose -f docker-compose.postgres.yml down

services:
  postgres:
    image: postgres:16-alpine
    container_name: moviehunter-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: Test_movies
    volumes:
      - moviehunter_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Test_movies"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: moviehunter-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - moviehunter_redis_data:/data
    command: /bin/sh -c 'redis-server --save 60 1 --loglevel warning --requirepass "$$REDIS_PASSWORD"'

volumes:
  moviehunter_pg_data:
  moviehunter_redis_data:
